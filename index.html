function audioOn(){if(AC){AC.resume();return;}try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=S.snd?1:0;master.connect(AC.destination);drone();}catch(e){AC=null;}}
let NB=null;function noise(){if(!NB){NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}const s=AC.createBufferSource();s.buffer=NB;s.loop=true;return s;}

function drone(){const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=170;const g=AC.createGain();g.gain.value=.05;lp.connect(g);g.connect(master);
  [49,51.7,73.4].forEach(f=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(lp);o.start();});
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.07;lg.gain.value=60;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();}
function knock(){if(!AC)return;const t=AC.currentTime;[0,.26,.47].forEach(d=>{const n=noise(),bp=AC.createBiquadFilter(),g=AC.createGain();bp.type='bandpass';bp.frequency.value=150;bp.Q.value=2.5;n.connect(bp);bp.connect(g);g.connect(master);env(g,t+d,.004,1.6,.16);n.start(t+d);n.stop(t+d+.3);});}
function rattle(){if(!AC)return;const t=AC.currentTime+.05,n=noise(),bp=AC.createBiquadFilter(),g=AC.createGain(),am=AC.createGain(),lfo=AC.createOscillator();bp.type='bandpass';bp.frequency.value=3200;bp.Q.value=5;
  lfo.type='square';lfo.frequency.value=26;lfo.connect(am.gain);am.gain.value=.5;n.connect(bp);bp.connect(am);am.connect(g);g.connect(master);env(g,t,.02,.35,.9);n.start(t);lfo.start(t);n.stop(t+1.1);lfo.stop(t+1.1);}
function whisper(dur=2.2,vol=.14){if(!AC)return;const t=AC.currentTime,n=noise(),b1=AC.createBiquadFilter(),b2=AC.createBiquadFilter(),g=AC.createGain(),am=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();
  b1.type='bandpass';b1.frequency.value=1900;b1.Q.value=1.4;b2.type='peaking';b2.frequency.value=3400;b2.gain.value=8;lfo.frequency.value=4.2+Math.random()*2;lg.gain.value=.5;am.gain.value=.5;lfo.connect(lg);lg.connect(am.gain);
  const pan=AC.createStereoPanner?AC.createStereoPanner():null;n.connect(b1);b1.connect(b2);b2.connect(am);am.connect(g);if(pan){pan.pan.value=Math.random()*1.6-.8;g.connect(pan);pan.connect(master);}else g.connect(master);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.4);g.gain.linearRampToValueAtTime(vol*.7,t+dur-.5);g.gain.linearRampToValueAtTime(0,t+dur);n.start(t);lfo.start(t);n.stop(t+dur+.1);lfo.stop(t+dur+.1);}
function thud(){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(30,t+.6);o.connect(g);g.connect(master);env(g,t,.005,.9,.9);o.start(t);o.stop(t+1);}
function stinger(){if(!AC)return;const t=AC.currentTime,lp=AC.createBiquadFilter(),g=AC.createGain();lp.type='lowpass';lp.frequency.value=2600;lp.connect(g);g.connect(master);env(g,t,.015,.42,1.8);
  [110,116.5,155.6,233.1,246.9,329.6,349.2].forEach(f=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f,t);o.frequency.linearRampToValueAtTime(f*.94,t+1.8);o.connect(lp);o.start(t);o.stop(t+2);});
  const n=noise(),hg=AC.createGain();n.connect(hg);hg.connect(master);env(hg,t,.005,.5,.35);n.start(t);n.stop(t+.5);}

/* ================= the rule: do not touch the exhibits ================= */
const E={phase:'idle',t:0,broken:0,next:0,lost:0};
const doorClosed=0,doorOpen=1.75;let dollHome=null;
const tmpV=new THREE.Vector3(),tmpV2=new THREE.Vector3();
function cabFront(v){return cab.localToWorld(v.set(0,.42,fz+.02));}
function canTouch(){if(E.phase!=='idle'||!doll)return false;cabFront(tmpV);const d=tmpV.distanceTo(cam.position);cam.getWorldDirection(tmpV2);return d<1.15&&tmpV2.dot(tmpV.sub(cam.position).normalize())>.75;}
function startTouch(){if(!canTouch())return;E.phase='reach';E.t=0;}
let noteT=null;function note(txt,ms){const n=$('note');n.textContent=txt;n.style.opacity=1;clearTimeout(noteT);if(ms)noteT=setTimeout(()=>{n.style.opacity=0;},ms);}
function hideDoll(){scene.attach(doll);cam.getWorldDirection(tmpV);tmpV.y=0;tmpV.normalize();
  let x=cam.position.x-tmpV.x*1.05,z=cam.position.z-tmpV.z*1.05;x=Math.max(BOUND.x0,Math.min(BOUND.x1,x));z=Math.max(BOUND.z0,Math.min(BOUND.z1,z));if(x<-2.3)z=Math.max(-.7,Math.min(.7,z));
  doll.position.set(x,0,z);doll.rotation.set(0,Math.atan2(cam.position.x-x,cam.position.z-z),0);}
function homeDoll(){cab.add(doll);doll.position.copy(dollHome.p);doll.rotation.copy(dollHome.r);doll.scale.copy(dollHome.s);}
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
let dark01=1,flash=0,shake=0;
function updateEvent(dt,t){
  E.t+=dt;const p=E.phase;
  if(p==='reach'){const k=ease(Math.min(1,E.t/.55));handR.position.lerpVectors(R_IDLE,R_TOUCH,k);handR.rotation.set(-.15*k,0,.12*(1-k));
    if(E.t>=.55){E.phase='shake';E.t=0;knock();rattle();}}
  else if(p==='shake'){const k=Math.min(1,E.t/1.2);shake=.004;if(E.t>.35){handR.position.lerpVectors(R_TOUCH,R_IDLE,ease(Math.min(1,(E.t-.35)/.5)));}
    if(E.t>=1.2){E.phase='black';E.t=0;shake=0;thud();whisper(2.6,.2);hideDoll();door.rotation.y=doorOpen;}}
  else if(p==='black'){dark01=0;if(E.t>=2.2){E.phase='gone';E.t=0;E.next=3.5;E.lost=0;note('You were told not to touch the exhibits.',5000);}}
  else if(p==='gone'){E.lost+=dt;if(E.t>E.next){E.next=E.t+4+Math.random()*3;whisper(1.6,.1+Math.min(.12,E.lost*.006));}
    if(E.lost>18&&E.lost<18+dt*1.5)note('Something is behind you.',4000);
    doll.getWorldPosition(tmpV);tmpV.y+=.45;cam.getWorldDirection(tmpV2);const d=tmpV.distanceTo(cam.position);
    if(d<3.2&&tmpV2.dot(tmpV.sub(cam.position).normalize())>.82){E.phase='lunge';E.t=0;stinger();flash=.85;E.from=doll.position.clone();}}
  else if(p==='lunge'){const k=Math.min(1,E.t/.38);cam.getWorldDirection(tmpV2);const to=tmpV.copy(cam.position).addScaledVector(tmpV2,.34);to.y=cam.position.y-.5;
    doll.position.lerpVectors(E.from,to,ease(k));doll.rotation.y=Math.atan2(cam.position.x-doll.position.x,cam.position.z-doll.position.z);shake=.012;
    if(E.t>=.5){E.phase='reset';E.t=0;shake=0;dark01=0;homeDoll();door.rotation.y=doorClosed;E.broken++;}}
  else if(p==='reset'){dark01=0;if(E.t>=1.3){E.phase='idle';E.t=0;dollYaw=0;awayFor=0;note('Rules broken: '+E.broken+' of 3',4500);}}
  if(p!=='black'&&p!=='reset'&&E.phase!=='black'&&E.phase!=='reset')dark01=Math.min(1,dark01+dt*1.6);
  flash=Math.max(0,flash-dt*1.4);$('flash').style.opacity=flash;
  cab.position.set(shake?(Math.random()-.5)*shake*2:0,shake?(Math.random()-.5)*shake:0,0);
  cam.position.x+=shake?(Math.random()-.5)*shake*.6:0;
}

/* ---- walking ---- */
const BOUND={x0:-2.95,x1:.45,z0:-2.2,z1:2.6};
let yaw=Math.PI/2,pitch=-.05,started=false,locked=false;const keys={};
cam.position.set(0,1.2,0);
const canvas=$('c');
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyL')toggle('bLan','lan');if(e.code==='KeyN')toggle('bDark','dark');if(e.code==='KeyE'&&started)startTouch();});
addEventListener('keyup',e=>{keys[e.code]=false;});addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===canvas;});
let drag=false,lx=0,ly=0;
canvas.addEventListener('mousedown',e=>{if(!started)return;if(locked&&canTouch()){startTouch();return;}drag=true;lx=e.clientX;ly=e.clientY;try{const p=canvas.requestPointerLock();if(p&&p.catch)p.catch(()=>{});}catch(_){}});
addEventListener('mouseup',()=>{drag=false;});
addEventListener('mousemove',e=>{if(!started)return;if(locked){yaw-=e.movementX*.0022;pitch-=e.movementY*.0022;}else if(drag){yaw+=(e.clientX-lx)*.004;pitch+=(e.clientY-ly)*.004;lx=e.clientX;ly=e.clientY;}pitch=Math.max(-1.2,Math.min(1.2,pitch));});
let tMove=null,tLook=null,tv={x:0,y:0};
canvas.addEventListener('touchstart',e=>{for(const t of e.changedTouches){if(t.clientX<innerWidth/2&&!tMove)tMove={id:t.identifier,x:t.clientX,y:t.clientY};else if(!tLook)tLook={id:t.identifier,x:t.clientX,y:t.clientY};}e.preventDefault();},{passive:false});
canvas.addEventListener('touchmove',e=>{for(const t of e.changedTouches){if(tMove&&t.identifier===tMove.id){tv.x=Math.max(-1,Math.min(1,(t.clientX-tMove.x)/60));tv.y=Math.max(-1,Math.min(1,(t.clientY-tMove.y)/60));}if(tLook&&t.identifier===tLook.id){yaw+=(t.clientX-tLook.x)*.005;pitch+=(t.clientY-tLook.y)*.005;pitch=Math.max(-1.2,Math.min(1.2,pitch));tLook.x=t.clientX;tLook.y=t.clientY;}}e.preventDefault();},{passive:false});
canvas.addEventListener('touchend',e=>{for(const t of e.changedTouches){if(tMove&&t.identifier===tMove.id){tMove=null;tv.x=tv.y=0;}if(tLook&&t.identifier===tLook.id)tLook=null;}});

const S={lan:true,dark:true,snd:true};
function toggle(id,k){S[k]=!S[k];$(id).classList.toggle('on',S[k]);}
$('bLan').onclick=()=>toggle('bLan','lan');$('bSnd').onclick=()=>{toggle('bSnd','snd');if(master)master.gain.value=S.snd?1:0;};$('prompt').onclick=()=>startTouch();$('bDark').onclick=()=>toggle('bDark','dark');
$('bSee').onclick=()=>{const d=new THREE.Vector3();shrine.getWorldPosition(d);yaw=Math.atan2(-(d.x-cam.position.x),-(d.z-cam.position.z));pitch=-.08;};
const touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
$('msgP').textContent=touch?'Drag the left side to walk, the right side to look. Use headphones.':'W A S D to walk, click and move the mouse to look, E to touch. L toggles your light, N toggles night. Esc frees the mouse. Use headphones.';
$('enter').onclick=()=>{started=true;audioOn();$('msg').style.display='none';if(!touch){try{const p=canvas.requestPointerLock();if(p&&p.catch)p.catch(()=>{});}catch(_){}}};

/* ---- loop ---- */
const clock=new THREE.Clock(),fwd=new THREE.Vector3(),toDoll=new THREE.Vector3(),dp=new THREE.Vector3();
let readyShown=false,awayFor=0;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(!readyShown&&room.isInitialized&&doll){readyShown=true;$('msgT').textContent='The Doll Room';$('enter').style.display='inline-block';}
  const frozen=E.phase==='lunge'||E.phase==='reset'||E.phase==='black';
  if(started&&!frozen){
    let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-tv.y,s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+tv.x;
    const L=Math.hypot(f,s);if(L>1){f/=L;s/=L;}const sp=(keys.ShiftLeft?2.6:1.5)*dt,sy=Math.sin(yaw),cy=Math.cos(yaw);
    cam.position.x=Math.max(BOUND.x0,Math.min(BOUND.x1,cam.position.x+(-sy*f+cy*s)*sp));
    cam.position.z=Math.max(BOUND.z0,Math.min(BOUND.z1,cam.position.z+(-cy*f-sy*s)*sp));
    if(cam.position.x<-2.3)cam.position.z=Math.max(-.75,Math.min(.75,cam.position.z));
    cam.position.y=1.2+(L>.1?Math.sin(t*8)*.018:0);
  }
  cam.rotation.set(pitch,yaw,0);
  const fl=1+Math.sin(t*9)*.05+Math.sin(t*23.3)*.04+(Math.sin(t*1.3)>.99?-.6:0);
  if(started)updateEvent(dt,t);
  const spark_=E.phase==='shake'?(Math.random()>.5?2.2:0):1;
  night.visible=S.dark||dark01<1;nightSdf.color.setRGB((S.dark?.3:1)*dark01+.004,(S.dark?.16:1)*dark01+.002,(S.dark?.16:1)*dark01+.002);
  glow.visible=S.dark;lamp.visible=S.dark&&S.lan&&dark01>.05;
  glowSdf.color.setRGB(2.4*fl*(E.phase==='shake'?spark_:1),1.1,1.1);
  const lanFl=(E.phase==='gone'?(Math.random()>.93?.3:1):1)*(1+Math.sin(t*13)*.05+Math.sin(t*31)*.03);
  lampSdf.position.copy(cam.position);lampSdf.color.setRGB(1+2.3*lanFl,1+1.7*lanFl,1+1.1*lanFl);
  flame.visible=halo.visible=S.lan;flame.scale.set(.05*lanFl,.07*lanFl,1);halo.material.opacity=.35*lanFl*dark01;
  cam.localToWorld(lanternL.position.set(0,-.08,-.9));lanternL.intensity=S.lan?.5*lanFl*dark01:0;handFill.intensity=S.lan?.05*lanFl:.0;
  red.intensity=.8*fl*spark_*dark01;spill.intensity=.1*fl*dark01;faceL.intensity=.35*dark01;hemi.intensity=(S.dark?.35:1.6)*dark01;bulb.visible=dark01>.5;
  { const mv=(keys.KeyW||keys.KeyS||keys.KeyA||keys.KeyD||keys.ArrowUp||keys.ArrowDown||keys.ArrowLeft||keys.ArrowRight||tv.x||tv.y)&&!frozen?1:0;
    handL.position.set(-.21+Math.sin(t*4)*.006*mv,-.06+Math.abs(Math.sin(t*4))*.008*mv+Math.sin(t*1.3)*.002,-.4);
    lanBody.rotation.z=Math.sin(t*4)*.12*mv+Math.sin(t*1.1)*.03;lanBody.rotation.x=Math.sin(t*1.7)*.025; }
  $('prompt').style.display=(started&&canTouch())?'block':'none';
  if(doll&&E.phase==='idle'){
    doll.getWorldPosition(dp);cam.getWorldDirection(fwd);toDoll.subVectors(dp,cam.position).normalize();
    const seen=fwd.dot(toDoll)>.55;awayFor=seen?0:awayFor+dt;
    if(awayFor>1.5){const local=cab.worldToLocal(cam.position.clone());dollYaw=Math.max(-1.1,Math.min(1.1,Math.atan2(local.x,local.z)));}
    doll.rotation.y+=(dollYaw-doll.rotation.y)*Math.min(1,dt*(seen?0:3));
  }
  renderer.render(scene,cam);
});
window.__t={E,touch:()=>{E.phase='reach';E.t=0;},set:(x,z,y,p)=>{cam.position.x=x;cam.position.z=z;yaw=y;pitch=p;},S,ready:()=>!!(room.isInitialized&&doll),go:()=>$('enter').click()};
</script>

</body></html>
